name: Windows app

# Builds cp-R-Setup-<version>.exe. Push a tag like v1.2.0 to build and attach
# it to a GitHub Release, or use "Run workflow" on the Actions tab for a test
# build (download it from the run's Artifacts section).
on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

env:
  R_VERSION: '4.5.3'

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: pwsh
        working-directory: electron
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: 22

      - name: Cache bundled R
        id: cache-r
        uses: actions/cache@v6
        with:
          path: electron/r-win
          key: r-win-${{ env.R_VERSION }}-${{ hashFiles('electron/scripts/get-r-windows.ps1', 'electron/scripts/install-pkgs.R') }}

      - name: Download and install portable R
        if: steps.cache-r.outputs.cache-hit != 'true'
        run: ./scripts/get-r-windows.ps1 -RVersion $env:R_VERSION

      - name: Install R packages into bundled R
        if: steps.cache-r.outputs.cache-hit != 'true'
        run: ./r-win/bin/Rscript.exe --vanilla scripts/install-pkgs.R

      - name: Smoke-test the app loads in bundled R
        run: ./r-win/bin/Rscript.exe --vanilla scripts/smoke-test.R

      - name: Set version from tag
        if: startsWith(github.ref, 'refs/tags/v')
        run: npm version ($env:GITHUB_REF_NAME -replace '^v','') --no-git-tag-version --allow-same-version

      - name: Install Electron tooling
        run: npm install --no-audit --no-fund

      - name: Build installer
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
        run: npm run dist

      - uses: actions/upload-artifact@v6
        with:
          name: cp-R-windows
          path: electron/dist/*.exe
          if-no-files-found: error

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v3
        with:
          files: electron/dist/*.exe
