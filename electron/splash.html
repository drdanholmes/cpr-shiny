<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>cp-R</title>
  <style>
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; flex-direction: column; align-items: center; justify-content: center;
      font-family: "Segoe UI", system-ui, sans-serif; background: #ffffff; color: #333;
      border: 1px solid #ccc; box-sizing: border-box; -webkit-app-region: drag;
    }
    h1 { font-size: 28px; margin: 0 0 8px; }
    p { margin: 0 0 20px; color: #666; }
    .spinner {
      width: 28px; height: 28px; border: 3px solid #ddd; border-top-color: #2c7be5;
      border-radius: 50%; animation: spin 0.9s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <h1>cp-R</h1>
  <p>Starting R&hellip;</p>
  <div class="spinner"></div>
</body>
</html>
